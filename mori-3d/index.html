<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mori · 촉감 바에 들어가기</title>
<meta name="description" content="밤의 촉감 바 mori에 들어가 병을 고르고, 기계에 올리고, 병을 열어 손끝으로 만져 보는 3D 체험.">
<style>html,body{height:100%;margin:0;overflow:hidden;background:#08070a}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}</style>
</head>
<body>
<!-- 바깥 틀: 브금만 들고 있고, 실제 화면(app.html)은 안쪽에 띄움. 다른 병으로 넘어갈 때 안쪽만 새로 불려서 음악이 끊기지 않음 -->
<script>if (parent !== window) location.replace('app.html' + location.search);   // 안쪽 화면의 링크(./?k=…)가 이 틀을 또 부르면 곧장 실제 화면으로 넘김</script>
<script src="bgm.js"></script>
<iframe id="app" title="mori 촉감 바" allow="autoplay"></iframe>
<script>
  const app = document.getElementById('app');
  app.onload = () => app.contentWindow.focus();                              // 키보드(Enter, 화살표)가 안쪽 화면으로 가게
  app.src = 'app.html' + location.search;
</script>
</body>
</html>
